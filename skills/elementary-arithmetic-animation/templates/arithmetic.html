<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>数一数 · 竖式动画实验室</title>
<style>
:root{--ink:#93b6d1;--green:#217363;--paper:#fcfaf3;--muted:#78847c;--orange:#ffbd74}*{box-sizing:border-box}body{margin:0;background:#f1f0e8;color:var(--ink);font-family:'Avenir Next','PingFang SC','Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;padding:24px 5%;border-bottom:1px solid #d9dfd5}.brand{font-size:22px;font-weight:800;letter-spacing:3px}.brand i{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--green);color:white;border-radius:50%;font-style:normal;margin-right:12px}.edition{font-size:12px;color:var(--muted);letter-spacing:2px}main{max-width:1420px;margin:auto;padding:36px 5%}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--green);font-weight:700}h1{font-size:38px;font-weight:600;margin:12px 0}.intro p{color:var(--muted);font-size:14px}.stamp{border:1px solid #bccbbd;border-radius:50%;width:84px;height:84px;display:grid;place-content:center;text-align:center;color:var(--green);font-size:12px;transform:rotate(9deg);line-height:1.8}.workspace{display:grid;grid-template-columns:300px minmax(0,1fr);gap:26px}.panel{background:var(--paper);border:1px solid #dce0d4;border-radius:18px;padding:23px}.label{font-size:12px;color:var(--muted);margin-bottom:14px}.operations{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:22px}.operations button{font-size:25px;background:transparent;border:1px solid #d9dfd5;border-radius:12px;padding:7px;color:var(--ink)}.operations button.active{background:var(--green);border-color:var(--green);color:white}label{font-size:12px;display:block;margin:15px 0 8px}input[type=number]{width:100%;padding:12px 15px;border:1px solid #d9dfd5;border-radius:10px;background:white;font-size:26px;color:var(--ink);font-family:Georgia,serif}button.primary{background:var(--green);color:white;border:0;border-radius:10px;padding:13px 16px;font-size:14px}.submit{width:100%;margin-top:22px}.examples{display:flex;flex-wrap:wrap;gap:7px}.examples button{background:#edf1e7;color:var(--green);border:0;padding:7px 10px;border-radius:7px;font-size:12px}.divider{height:1px;background:#e0e4d9;margin:25px 0}.hint{font-size:12px;color:var(--muted);line-height:1.9}.error{color:#ae432d;min-height:22px;font-size:12px;margin-top:10px}.lesson{padding:0;overflow:hidden}.lesson-head{padding:19px 26px;display:flex;justify-content:space-between;border-bottom:1px solid #e0e4d9;align-items:center}.lesson-head strong{font-family:Georgia,serif;font-size:23px;font-weight:500}.tag{font-size:11px;background:#e8efe4;padding:6px 11px;border-radius:20px;color:var(--green)}.board{background-color:var(--paper);background-image:linear-gradient(#618c6910 1px,transparent 1px),linear-gradient(90deg,#618c6910 1px,transparent 1px);background-size:26px 26px;min-height:390px;padding:10px 25px;display:flex;align-items:center;justify-content:center}.board svg{width:100%;height:360px;overflow:visible}.teaching{margin:0 25px 22px;padding:18px 21px;background:#edf2e7;border-left:3px solid var(--green);border-radius:0 10px 10px 0;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.teaching h2{font-size:16px;margin:0 0 7px}.teaching p{font-size:13px;line-height:1.7;margin:0;color:#68776a}.equation{font-family:Georgia,serif;font-size:24px;color:var(--green);white-space:nowrap}.transport{border-top:1px solid #e0e4d9;padding:18px 25px}.progress{display:flex;gap:5px;margin-bottom:17px}.progress button{height:5px;flex:1;padding:0;border:0;border-radius:9px;background:#dce4d7}.progress button.done{background:var(--green)}.controls{display:flex;align-items:center;gap:9px}.controls button.secondary{background:transparent;border:1px solid #d5ddce;border-radius:9px;padding:10px 13px;color:var(--ink)}.controls button:disabled{opacity:.35;cursor:default}.speed{margin-left:auto;color:var(--muted);font-size:12px}.speed select{border:0;color:var(--green);background:transparent}.count{font-size:12px;color:var(--muted);margin-left:6px}.foot{display:flex;gap:25px;justify-content:center;margin:24px 0;color:var(--muted);font-size:11px}.legend:before{content:'';display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:6px}.legend.orange:before{background:var(--orange)}:focus-visible{outline:3px solid #d99148;outline-offset:3px}footer{margin-top:30px;display:flex;justify-content:space-between;color:#8e998b;font-size:11px}svg text{font-family:Georgia,'PingFang SC',serif}.digit{fill:var(--ink);font-size:48px}.changed{fill:var(--orange);font-size:27px}.note{fill:#7899b2;font-size:14px}.zero{fill:#a0aaa0}.answer{fill:var(--green)}@media(max-width:850px){main{padding:24px 16px}.workspace{grid-template-columns:1fr}.intro h1{font-size:29px}.stamp{display:none}.panel.inputs{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.inputs>.label,.operations,.submit,.divider,.examples,.hint,.error{grid-column:1/-1}.inputs label{grid-row:auto}.teaching{grid-template-columns:1fr}.equation{white-space:normal;font-size:21px}.controls{flex-wrap:wrap}.board{padding:8px}.edition{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

.block-panel{margin:0 25px 22px;border:1px solid #dce4d5;border-radius:12px;overflow:hidden;background:#f6f7ed}.block-heading{padding:13px 17px;display:flex;justify-content:space-between;gap:12px;font-size:13px}.block-heading span{font-size:11px;color:var(--muted)}.block-panel svg{display:block;width:100%;height:auto;max-height:260px}.block-caption{padding:0 17px 13px;font-size:12px;line-height:1.7;color:var(--green);margin:0}.block-empty{padding:0 17px 16px;color:var(--muted);font-size:12px;line-height:1.8}.block-panel text{font-family:'PingFang SC',sans-serif}.block-replay{border:0;background:transparent;color:var(--green);font-size:12px;padding:0}.block-replay:disabled{opacity:.4;cursor:default}@media(max-width:850px){.block-panel{margin:0 12px 16px}.block-heading{flex-wrap:wrap}.block-panel svg{min-height:190px}}

/* Phone layout: readable working area and thumb-accessible transport. */
@media(max-width:600px){
 header{padding:12px 16px}.brand{font-size:19px}.brand i{width:29px;height:29px;margin-right:8px}
 main{padding:19px 12px calc(155px + env(safe-area-inset-bottom))}.intro{margin-bottom:18px}.eyebrow{font-size:10px;letter-spacing:2px}.intro h1{font-size:clamp(23px,6.7vw,31px);margin:9px 0}.intro p{font-size:12px;line-height:1.7;margin:7px 0}
 .workspace{gap:16px}.panel{border-radius:14px;min-width:0}.panel.inputs{padding:16px;gap:0 12px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.inputs>.label{margin-bottom:10px}.operations{margin-bottom:0;gap:9px}.operations button{min-height:44px;padding:4px;font-size:26px}.inputs label{margin:12px 0 6px}.inputs input{min-width:0;padding:9px 12px;font-size:24px;height:48px}.submit{margin-top:14px;min-height:44px}.inputs .divider{margin:12px 0}.error:empty{display:none}.examples{display:grid;grid-template-columns:1fr 1fr;gap:8px}.examples button{min-height:44px;font-size:12px}.hint{font-size:11px;line-height:1.6}.hint br{display:none}.inputs .divider:last-of-type{margin:8px 0}
 .lesson-head{padding:15px 16px;gap:10px}.lesson-head strong{font-size:22px;overflow-wrap:anywhere}.tag{flex-shrink:0}.board{display:block;min-height:0;max-height:470px;overflow:auto;padding:12px 8px;overscroll-behavior:contain}.board svg{height:auto!important;display:block;overflow:hidden}
 .teaching{margin:0 12px 14px;padding:14px;gap:9px;min-width:0}.teaching h2{font-size:16px}.teaching p{font-size:13px}.equation{font-size:clamp(18px,5.5vw,23px);overflow-wrap:anywhere;min-width:0}
 .block-panel{margin:0 12px 14px}.block-heading{padding:12px;align-items:center;gap:8px}.block-heading strong{font-size:14px}.block-heading span{order:3;flex-basis:100%}.block-replay{min-height:44px;padding:8px;margin-left:auto}.block-panel svg{max-height:none;min-height:0}.block-caption{padding:0 12px 14px;font-size:13px}.block-empty{padding:0 12px 14px}
 .transport{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:0 12px calc(8px + env(safe-area-inset-bottom));background:#fcfaf3f5;backdrop-filter:blur(14px);box-shadow:0 -5px 25px #93b6d110;border-top:1px solid #d5ddce}.progress{gap:3px;margin:0;overflow-x:auto;padding:0;min-height:24px;align-items:center}.progress button{min-width:8px;height:24px;flex:1;background:linear-gradient(#dce4d7,#dce4d7) center/100% 4px no-repeat}.progress button.done{background:linear-gradient(var(--green),var(--green)) center/100% 4px no-repeat}
 .controls{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);gap:6px}.controls button.secondary,.controls button.primary{font-size:12px;padding:10px 3px;min-height:46px;white-space:nowrap}.count{grid-column:1/3;grid-row:2;margin:0 0 0 4px;align-self:center;font-size:11px}.speed{grid-column:3/5;grid-row:2;justify-self:end;margin:0;display:flex;align-items:center;gap:4px;font-size:11px}.speed select{min-height:36px;min-width:62px;font-size:16px}.foot{gap:8px;flex-wrap:wrap;font-size:10px;margin:18px 0}footer{margin-top:18px;gap:8px;flex-wrap:wrap;font-size:10px}
}
</style><style>/*__THEME__*/</style></head><body>
<header><div class="brand"><i>＋</i>数一数</div><div class="edition">MATH ORBIT / 数学实验舱</div></header>
<main><div class="intro"><div><div class="eyebrow">MATH ORBIT / 数学探索计划</div><h1>让数字<em>动起来。</em></h1><p>把每一次进位与退位，变成看得见的探索。</p></div><div class="stamp"><b>＋</b><span>EXPLORE</span></div></div>
<div class="workspace"><form class="panel inputs" id="form"><div class="label">01 / 选择一道算式</div><div class="operations" role="group" aria-label="选择运算"><button type="button" data-op="+" aria-label="加法">+</button><button type="button" data-op="-" aria-label="减法">−</button><button type="button" data-op="*" aria-label="乘法">×</button><button type="button" data-op="/" aria-label="除法">÷</button></div><div><label for="a">第一个数</label><input id="a" type="number" inputmode="numeric" min="0" max="9999" required value="278"></div><div><label for="b">第二个数</label><input id="b" type="number" inputmode="numeric" min="0" max="9999" required value="156"></div><button class="primary submit" type="submit">生成分解动画 ↗</button><div class="error" role="alert" id="error"></div><div class="divider"></div><div class="label">试试这些小挑战</div><div class="examples"><button type="button" data-example="278,+,156">连续进位</button><button type="button" data-example="1000,-,586">跨零退位</button><button type="button" data-example="48,*,27">两位数乘法</button><button type="button" data-example="1005,/,5">商中间有零</button></div><div class="divider"></div><div class="hint">支持 0—9999 的整数。<br>减法结果非负；除法保留余数。<br>点「下一步」，按自己的节奏学习。</div></form>
<section class="panel lesson" aria-label="竖式教学"><div class="lesson-head"><strong id="problem"></strong><span class="tag" id="tag">数位对齐</span></div><div class="board"><svg id="scene" role="img" aria-label="当前步骤的竖式" viewBox="0 0 760 440"></svg></div><div class="teaching" aria-live="polite"><div><h2 id="stepTitle"></h2><p id="explain"></p></div><div class="equation" id="equation"></div></div><section class="block-panel" aria-label="积木算理演示"><div class="block-heading"><strong>积木实验台</strong><span id="blockUnit">十进制 · 拆开与合并</span><button type="button" class="block-replay" id="blockReplay">↺ 重看积木</button></div><svg id="blocks" role="img" aria-label="当前数位的积木变化" viewBox="0 0 680 230"></svg><p class="block-caption" id="blockCaption"></p><div class="block-empty" id="blockEmpty"></div></section><div class="transport"><div class="progress" id="progress" aria-label="选择步骤"></div><div class="controls"><button type="button" class="secondary" id="restart" aria-label="从头重播">↺</button><button type="button" class="secondary" id="prev">← 上一步</button><button type="button" class="primary" id="play">▶ 自动播放</button><button type="button" class="secondary" id="next">下一步 →</button><span class="count" id="count"></span><label class="speed">速度 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label></div></div></section></div><div class="foot"><span class="legend">薄荷绿：当前数位与结果</span><span class="legend orange">琥珀色：进位与退位</span><span>支持离线 · 无需登录</span></div><footer><span>INTERACTIVE EDU SKILLS</span><span>把计算变成一次看得见的探索。</span></footer></main>
<script>/*__GSAP__*/</script><script>/*__ENGINE__*/</script><script>/*__BLOCKS__*/</script><script>
const $=id=>document.getElementById(id),scene=$('scene');let op='+',lesson,index=0,tl=null,playing=false,blockTimeline=null;
const defaults=/*__DEFAULTS__*/;
function stop(){if(blockTimeline){blockTimeline.progress(1).kill();blockTimeline=null;}playing=false;if(tl){tl.kill();tl=null;}gsap.killTweensOf('.moving');gsap.set('.moving',{opacity:1,y:0,scale:1});$('play').textContent='▶ 自动播放';}
function setOp(v){op=v;document.querySelectorAll('[data-op]').forEach(el=>{el.classList.toggle('active',el.dataset.op===v);el.setAttribute('aria-pressed',String(el.dataset.op===v));});}
function generate(){stop();try{if($('a').value.trim()===''||$('b').value.trim()==='')throw Error('请填写两个数字');lesson=Arithmetic.solve(Number($('a').value),Number($('b').value),op);$('error').textContent='';index=0;$('problem').textContent=`${lesson.a} ${Arithmetic.symbol(op)} ${lesson.b}`;render();}catch(e){$('error').textContent=e.message;}}
function render(){
 if(blockTimeline){blockTimeline.kill();blockTimeline=null;}
 gsap.killTweensOf('.moving');
 const s=lesson.steps[index],maxcol=Math.max(...s.rows.flatMap(r=>Object.keys(r.cells).map(Number)),String(lesson.a).length-1),dx=Math.min(70,480/(maxcol+1)),right=560,x=c=>right-c*dx;
 let height=Math.max(440,...s.rows.map(r=>r.y+65));const phone=matchMedia('(max-width:600px)').matches;const left=phone?Math.max(0,x(maxcol)-(op==='/'?String(lesson.b).length*29+75:105)):0;const viewWidth=phone?610-left:760;scene.setAttribute('viewBox',`${left} 0 ${viewWidth} ${height}`);scene.style.height=Math.min(620,height*.82)+'px';let svg='';
 s.hot.forEach(c=>svg+=`<rect x="${x(c)-29}" y="95" width="58" height="${height-140}" rx="14" fill="#64f5c110" stroke="#64f5c160" stroke-dasharray="4 5"/>`);
 if(op!=='/')for(let c=0;c<=maxcol;c++)svg+=`<text x="${x(c)}" y="${op==='*'?35:50}" text-anchor="middle" class="note">${Arithmetic.place(c)}</text>`;
 if(op==='/'){const left=x(String(lesson.a).length-1)-40;svg+=`<path d="M${left-12} 100 Q${left+12} 125 ${left-12} 165 M${left-12} 100 H${right+38}" fill="none" stroke="#93b6d1" stroke-width="2"/><text x="${left-35}" y="150" text-anchor="end" class="digit">${lesson.b}</text>`;}else{svg+=`<text x="${x(maxcol)-75}" y="230" class="digit">${Arithmetic.symbol(op)}</text><path d="M${x(maxcol)-35} 268 H${right+35}" stroke="#93b6d1" stroke-width="2"/>`;}
 if(op==='*'){const answer=s.rows.find(r=>r.id==='answer');if(answer)svg+=`<path d="M${x(maxcol)-35} ${answer.y-58} H${right+35}" stroke="#93b6d1" stroke-width="2"/>`;}
 s.rows.forEach(r=>{
 Object.entries(r.cells).forEach(([c,d])=>{const changed=r.id==='a'&&s.marks[c]!==undefined&&op==='-';const focused=s.focus===`${r.id}:${c}`||s.focus===`${r.id}:all`;svg+=`<text data-key="${r.id}:${c}" x="${x(+c)}" y="${r.y}" text-anchor="middle" class="digit ${r.id==='answer'||r.id==='quotient'?'answer':''} ${focused?'moving':''} ${op==='*'&&r.id.startsWith('part')&&+c<+r.id.slice(4)?'zero':''}" ${changed?'opacity=".35"':''}>${d}</text>`;if(changed)svg+=`<path d="M${x(+c)-14} ${r.y-32} l28 25" stroke="#ffbd74" stroke-width="2"/>`;});
 if(op==='/'&&r.id.startsWith('product')){const cs=Object.keys(r.cells).map(Number);svg+=`<text x="${x(Math.max(...cs))-65}" y="${r.y}" class="changed">−</text><path d="M${x(Math.max(...cs))-30} ${r.y+15} H${x(Math.min(...cs))+32}" stroke="#7899b2" stroke-width="1.5"/>`;}
 });
 Object.entries(s.marks).forEach(([c,d])=>svg+=`<text data-key="mark:${c}:${d}" x="${x(+c)}" y="${op==='-'?105:op==='*'?110:95}" text-anchor="middle" class="changed moving">${d}</text>`);
 scene.innerHTML=svg;renderBlocks(s);$('stepTitle').textContent=s.title;$('explain').textContent=s.text;$('equation').textContent=s.equation;$('tag').textContent=index===lesson.steps.length-1?'完成啦！':'一步一步来';$('count').textContent=`${index+1} / ${lesson.steps.length}`;$('prev').disabled=index===0;$('next').disabled=index===lesson.steps.length-1;
 $('progress').innerHTML=lesson.steps.map((_,i)=>`<button type="button" data-step="${i}" class="${i<=index?'done':''}" aria-label="第 ${i+1} 步" ${i===index?'aria-current="step"':''}></button>`).join('');
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)gsap.fromTo('.moving',{opacity:0,y:-20,scale:.75,transformOrigin:'50% 50%'},{opacity:1,y:0,scale:1,duration:.65,ease:'back.out(1.3)'});
}
function go(i){stop();index=Math.max(0,Math.min(lesson.steps.length-1,i));render();}
function auto(){if(playing){playing=false;tl?.pause();blockTimeline?.pause();$('play').textContent='▶ 自动播放';return;}if(tl?.paused()){playing=true;tl.resume();blockTimeline?.resume();$('play').textContent='Ⅱ 暂停';return;}if(index===lesson.steps.length-1)index=0;playing=true;$('play').textContent='Ⅱ 暂停';render();schedule();}
function schedule(){tl=gsap.timeline({onComplete:()=>{if(!playing)return;if(index<lesson.steps.length-1){index++;render();schedule();}else stop();}});tl.to({}, {duration:(lesson.steps[index].blocks?4.8:2.7)/Number($('speed').value)});}
$('blockReplay').onclick=()=>{stop();renderBlocks(lesson.steps[index]);};
$('form').onsubmit=e=>{e.preventDefault();generate();if(!$('error').textContent&&matchMedia('(max-width:600px)').matches){document.activeElement?.blur();document.querySelector('.lesson').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});}};document.querySelectorAll('[data-op]').forEach(el=>el.onclick=()=>{setOp(el.dataset.op);generate();});document.querySelectorAll('[data-example]').forEach(el=>el.onclick=()=>{const [a,o,b]=el.dataset.example.split(',');$('a').value=a;$('b').value=b;setOp(o);generate();});$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('restart').onclick=()=>go(0);$('play').onclick=auto;$('speed').onchange=()=>{blockTimeline?.timeScale(Number($('speed').value));if(playing){tl.kill();schedule();}};$('progress').onclick=e=>{if(e.target.dataset.step!==undefined)go(+e.target.dataset.step);};
let responsiveFrame;window.addEventListener('resize',()=>{cancelAnimationFrame(responsiveFrame);responsiveFrame=requestAnimationFrame(()=>{if(lesson){stop();render();}});});
$('a').value=defaults.a;$('b').value=defaults.b;setOp(defaults.op);generate();
</script></body></html>
